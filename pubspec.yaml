name: credix_app
description: A Very Good Project created by Very Good CLI.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  auto_route: ^10.0.1
  bloc: ^9.0.0
  dio: ^5.8.0+1
  dotted_dashed_line: ^0.0.3
  either_dart: ^1.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
